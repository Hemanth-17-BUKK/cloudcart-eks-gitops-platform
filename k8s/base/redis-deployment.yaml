---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis

  namespace: cloudcart

  labels:
    app: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis

          image: redis:8

          ports:
            - containerPort: 6379

          livenessProbe:
            tcpSocket:
              port: 6379

            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            tcpSocket:
              port: 6379

            initialDelaySeconds: 5
            periodSeconds: 5
