---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

  namespace: cloudcart

  labels:
    app: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: "cloudcart"

            - name: POSTGRES_DB
              value: "cloudcart_auth"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcart-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-storage

              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage

          persistentVolumeClaim:
            claimName: postgres-pvc
