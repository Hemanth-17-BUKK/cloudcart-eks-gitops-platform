---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service

  namespace: cloudcart

  labels:
    app: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service

          image: cloudcart-eks-gitops-platform-user-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: DB_USER
              value: "cloudcart"

            - name: DB_NAME
              value: "cloudcart_auth"

          envFrom:
            - configMapRef:
                name: cloudcart-config

            - secretRef:
                name: cloudcart-secret

          livenessProbe:
            httpGet:
              path: /health
              port: 3001

            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ready
              port: 3001

            initialDelaySeconds: 5
            periodSeconds: 5
